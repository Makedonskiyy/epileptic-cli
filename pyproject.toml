[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epilepticcli"
version = "0.1.0"
description = "EpilepticCLI - a multi-provider AI terminal client with deep system-prompt control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Epileptic Hurts" }]
keywords = ["cli", "ai", "llm", "terminal", "agent", "tui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Text Editors :: Text Processing",
]
dependencies = [
    "openai>=1.40",
    "anthropic>=0.34",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["ruff>=0.5", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Makedonskiyy/epileptic-cli"
Issues = "https://github.com/Makedonskiyy/epileptic-cli/issues"

[project.scripts]
epileptic = "epilepticcli.cli:main"
epic = "epilepticcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
